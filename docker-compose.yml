version: '3.8'

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SECOND_BRAIN_DATABASE_MODE=postgres
      - SECOND_BRAIN_DATABASE_URL=postgresql+psycopg://second_brain:${POSTGRES_PASSWORD:-second_brain_secret}@postgres:5432/second_brain
      - SECOND_BRAIN_REDIS_URL=redis://redis:6379/0
      - SECOND_BRAIN_CHROMA_PERSIST_DIR=/app/data/chroma
      - SECOND_BRAIN_UPLOAD_DIR=/app/data/uploads
      - SECOND_BRAIN_LLM_PROVIDER=ollama
      - SECOND_BRAIN_OLLAMA_BASE_URL=http://ollama:11434
      - SECOND_BRAIN_ALLOW_REMOTE_CLIENTS=true
      - SECOND_BRAIN_API_HOST=0.0.0.0
    volumes:
      - second_brain_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    expose:
      - "8000"

  # ── Frontend (Nginx serving React build) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama (Local LLM) ────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - second_brain_ollama_data:/root/.ollama
    # Ollama is intentionally NOT exposed externally — only backend accesses it
    expose:
      - "11434"

  # ── PostgreSQL 16 ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=second_brain
      - POSTGRES_USER=second_brain
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-second_brain_secret}
    volumes:
      - second_brain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_brain"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed externally — only backend/celery access it
    expose:
      - "5432"

  # ── Redis 7 ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - second_brain_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  # ── Celery Worker ─────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.job_queue.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - SECOND_BRAIN_DATABASE_MODE=postgres
      - SECOND_BRAIN_DATABASE_URL=postgresql+psycopg://second_brain:${POSTGRES_PASSWORD:-second_brain_secret}@postgres:5432/second_brain
      - SECOND_BRAIN_REDIS_URL=redis://redis:6379/0
      - SECOND_BRAIN_CHROMA_PERSIST_DIR=/app/data/chroma
      - SECOND_BRAIN_OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - second_brain_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Celery Flower (Dev monitoring UI — dev profile only) ──────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.job_queue.celery_app flower --port=5555
    profiles: ["dev"]
    environment:
      - SECOND_BRAIN_REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  second_brain_data:
  second_brain_postgres_data:
  second_brain_redis_data:
  second_brain_ollama_data:
