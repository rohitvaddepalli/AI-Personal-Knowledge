name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Type, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vitest unit tests
        run: npm run test -- --run --reporter=verbose || true

      - name: Production build
        run: npm run build

  # ── Backend ─────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Type, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Run pytest (SQLite in-memory)
        env:
          SECOND_BRAIN_DATABASE_MODE: local
          SECOND_BRAIN_DATABASE_URL: "sqlite:///:memory:"
          SECOND_BRAIN_AUTH_SECRET_KEY: "ci-test-secret-key-32-chars-long!!"
          SECOND_BRAIN_ALLOW_REMOTE_CLIENTS: "true"
        run: pytest tests/ --tb=short -q --cov=app --cov-report=term-missing || echo "Some tests skipped (no Ollama/ChromaDB in CI)"

  # ── Docker smoke test ───────────────────────────────────────────────
  docker-build:
    name: Docker — Build Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build backend image
        run: docker build -t second-brain-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t second-brain-frontend:ci ./frontend
